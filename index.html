<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#A83A4A">
<title>Diário Glicêmico</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A9%B8%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ECEFE9;
    --surface:#FFFFFF;
    --surface-2:#F6F5F0;
    --ink:#202B27;
    --ink-soft:#63706A;
    --border:#DEE2D9;
    --accent:#A83A4A;
    --accent-ink:#FFFFFF;

    --jejum:#7C8CB5;
    --cafe:#DE9A2E;
    --almoco:#D9773B;
    --jantar:#6B4C6B;

    --success:#3E7A57;
    --error:#B23A3A;
    --warning:#B5811A;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    background-image:radial-gradient(circle at 15% 0%, rgba(124,140,181,0.10), transparent 40%),
                      radial-gradient(circle at 100% 10%, rgba(222,154,46,0.10), transparent 45%);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }

  .app{
    width:100%;
    max-width:430px;
    padding:max(20px, env(safe-area-inset-top)) 18px 32px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 2px 2px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .drop{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(160deg,var(--jejum),var(--cafe) 40%,var(--almoco) 70%,var(--jantar));
    flex-shrink:0;
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    letter-spacing:-0.01em;
    margin:0;
  }
  .icon-btn{
    width:40px;height:40px;border-radius:12px;
    border:1px solid var(--border);
    background:var(--surface);
    font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    transition:transform .15s ease, background .15s ease;
  }
  .icon-btn:active{transform:scale(0.92);}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:22px;
    padding:22px 18px 20px;
    display:flex;
    flex-direction:column;
    gap:20px;
    box-shadow:0 1px 2px rgba(32,43,39,0.03), 0 12px 28px -18px rgba(32,43,39,0.25);
  }

  .field{display:flex;flex-direction:column;gap:8px;}
  .field-label{
    font-size:12.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
  }
  input[type=date], input[type=number]{
    font-family:'Inter',sans-serif;
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:13px;
    padding:13px 14px;
    outline:none;
    width:100%;
  }
  input[type=date]:focus, input[type=number]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(168,58,74,0.12);
  }

  .moment-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .moment{
    --tint:var(--jejum);
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px 12px;
    border-radius:14px;
    border:1.5px solid var(--border);
    background:var(--surface-2);
    cursor:pointer;
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .moment:active{transform:scale(0.97);}
  .moment .emoji{
    width:30px;height:30px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    background:var(--tint);
    flex-shrink:0;
  }
  .moment[data-type="jejum"]{--tint:var(--jejum);}
  .moment[data-type="cafe"]{--tint:var(--cafe);}
  .moment[data-type="almoco"]{--tint:var(--almoco);}
  .moment[data-type="jantar"]{--tint:var(--jantar);}
  .moment.active{
    border-color:var(--tint);
    background:color-mix(in srgb, var(--tint) 12%, var(--surface-2));
  }

  .save-btn{
    margin-top:2px;
    padding:15px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:var(--accent-ink);
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:.01em;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .save-btn:active{transform:scale(0.98);}
  .save-btn:disabled{opacity:.6;}

  .btn-row{display:flex;gap:10px;align-items:stretch;}
  .btn-row .save-btn{flex:1;margin-top:0;}
  .delete-btn{
    flex:none;
    width:36px;
    padding:0;
    margin-top:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface-2);
    color:var(--error);
    border:1.5px solid var(--error);
    font-size:18px;
  }

  .hint{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin:0;
    padding:0 12px;
  }
  .hint.warn{color:var(--warning);}

  .toast{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translate(-50%, 20px);
    max-width:88%;
    background:var(--ink);
    color:#fff;
    font-size:14px;
    font-weight:500;
    padding:13px 18px;
    border-radius:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .toast.open{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
  .toast.success{background:var(--success);}
  .toast.error{background:var(--error);}
  .toast.warning{background:var(--warning);color:#2A2107;}

  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(32,43,39,0.45);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .18s ease;
    z-index:10;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal{
    width:100%;max-width:430px;
    background:var(--surface);
    border-radius:22px 22px 0 0;
    padding:24px 20px max(24px, env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .22s ease;
    display:flex;flex-direction:column;gap:12px;
  }
  .modal-overlay.open .modal{transform:translateY(0);}
  .modal h2{
    font-family:'Fraunces',serif;
    font-size:19px;font-weight:600;margin:0;
  }
  .modal p{font-size:13.5px;color:var(--ink-soft);margin:0 0 4px;line-height:1.5;}
  .modal input{
    font-size:14px;padding:12px 13px;border-radius:12px;
    border:1px solid var(--border);background:var(--surface-2);
    font-family:'Inter',sans-serif;outline:none;
  }
  .modal input:focus{border-color:var(--accent);}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions button{
    flex:1;padding:12px;border-radius:12px;border:none;
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;cursor:pointer;
  }
  #cancelModal{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border);}
  #saveModal{background:var(--accent);color:#fff;}
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="drop"></div>
        <h1>Diário Glicêmico</h1>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Configurações">⚙</button>
    </header>

    <div class="card">
      <label class="field">
        <span class="field-label">Data</span>
        <input type="date" id="dateInput">
      </label>

      <div class="field">
        <span class="field-label">Momento do dia</span>
        <div class="moment-grid" id="momentGrid">
          <button type="button" class="moment" data-type="jejum">
            <span class="emoji">🌅</span><span>Jejum</span>
          </button>
          <button type="button" class="moment" data-type="cafe">
            <span class="emoji">☕</span><span>Pós-café</span>
          </button>
          <button type="button" class="moment" data-type="almoco">
            <span class="emoji">🍽️</span><span>Pós-almoço</span>
          </button>
          <button type="button" class="moment" data-type="jantar">
            <span class="emoji">🌙</span><span>Pós-jantar</span>
          </button>
        </div>
      </div>

      <label class="field">
        <span class="field-label">Glicemia (mg/dL)</span>
        <input type="number" inputmode="decimal" id="valueInput" placeholder="Ex: 98">
      </label>

      <div class="btn-row">
        <button class="save-btn delete-btn" id="deleteBtn" type="button" aria-label="Apagar registro" title="Apagar registro">🗑</button>
        <button class="save-btn" id="saveBtn">Salvar registro</button>
      </div>
    </div>

    <p class="hint" id="connectionHint"></p>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Conectar planilha</h2>
      <p>Cole a URL do seu Web App do Google Apps Script (veja o guia de implantação que acompanha este arquivo).</p>
      <input type="url" id="scriptUrlInput" default="https://script.google.com/macros/s/AKfycbwbn6BtAWLzl5JsaEm1_-ucSY80MtHnGieJEtp2o92lDQlQJ6s_x9GyaF0wWpM5GqGQ/exec" placeholder="https://script.google.com/macros/s/AKfycb.../exec">
      <div class="modal-actions">
        <button id="cancelModal" type="button">Cancelar</button>
        <button id="saveModal" type="button">Salvar</button>
      </div>
    </div>
  </div>

<script>
  const CONFIG_KEY = 'glicoDiarioScriptUrl';
  let scriptUrl = localStorage.getItem(CONFIG_KEY) || '';
  let selectedType = null;

  const dateInput = document.getElementById('dateInput');
  const momentGrid = document.getElementById('momentGrid');
  const valueInput = document.getElementById('valueInput');
  const saveBtn = document.getElementById('saveBtn');
  const deleteBtn = document.getElementById('deleteBtn');
  const toast = document.getElementById('toast');
  const connectionHint = document.getElementById('connectionHint');
  const settingsBtn = document.getElementById('settingsBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const scriptUrlInput = document.getElementById('scriptUrlInput');
  const cancelModal = document.getElementById('cancelModal');
  const saveModal = document.getElementById('saveModal');

  function todayISO(){
    const d = new Date();
    const local = new Date(d.getTime() - d.getTimezoneOffset()*60000);
    return local.toISOString().slice(0,10);
  }
  dateInput.value = todayISO();

  function toBR(iso){
    const [y,m,d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  momentGrid.querySelectorAll('.moment').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      momentGrid.querySelectorAll('.moment').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      selectedType = btn.dataset.type;
    });
  });

  function momentForHour(hour){
    if (hour < 7) return 'jejum';
    if (hour < 12) return 'cafe';
    if (hour < 17) return 'almoco';
    return 'jantar';
  }

  const defaultType = momentForHour(new Date().getHours());
  const defaultBtn = momentGrid.querySelector(`.moment[data-type="${defaultType}"]`);
  if (defaultBtn){
    defaultBtn.classList.add('active');
    selectedType = defaultType;
  }

  function updateConnectionHint(){
    connectionHint.textContent = scriptUrl
      ? 'Conectado à sua planilha.'
      : 'Toque na engrenagem para conectar sua planilha.';
    connectionHint.classList.toggle('warn', !scriptUrl);
  }
  updateConnectionHint();

  settingsBtn.addEventListener('click', ()=>{
    scriptUrlInput.value = scriptUrl;
    modalOverlay.classList.add('open');
  });
  cancelModal.addEventListener('click', ()=> modalOverlay.classList.remove('open'));
  saveModal.addEventListener('click', ()=>{
    scriptUrl = scriptUrlInput.value.trim();
    localStorage.setItem(CONFIG_KEY, scriptUrl);
    updateConnectionHint();
    modalOverlay.classList.remove('open');
  });
  modalOverlay.addEventListener('click', (e)=>{
    if (e.target === modalOverlay) modalOverlay.classList.remove('open');
  });

  function showToast(kind, message){
    toast.textContent = message;
    toast.className = 'toast open ' + kind;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> toast.classList.remove('open'), 3400);
  }

  async function sendRecord(payload, btn, idleLabel, busyLabel, successMsg){
    if (!scriptUrl){
      showToast('error', 'Conecte sua planilha primeiro (engrenagem no topo).');
      return;
    }
    if (!selectedType){
      showToast('error', 'Escolha o momento do dia.');
      return;
    }

    btn.disabled = true;
    btn.textContent = busyLabel;

    try {
      const res = await fetch(scriptUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.status === 'ok'){
        showToast('success', successMsg);
        valueInput.value = '';
      } else {
        showToast('error', json.message || 'A planilha recusou a operação.');
      }
    } catch (err) {
      showToast('warning', 'Enviado, mas não foi possível confirmar (CORS). Verifique a planilha.');
      valueInput.value = '';
    } finally {
      btn.disabled = false;
      btn.textContent = idleLabel;
    }
  }

  saveBtn.addEventListener('click', ()=>{
    const value = parseFloat(valueInput.value);
    if (isNaN(value) || value <= 0){
      showToast('error', 'Digite um valor de glicemia válido.');
      return;
    }
    const payload = { date: toBR(dateInput.value), type: selectedType, value, action: 'save' };
    sendRecord(payload, saveBtn, 'Salvar registro', 'Enviando…', 'Registro salvo na planilha.');
  });

  deleteBtn.addEventListener('click', ()=>{
    if (!selectedType){
      showToast('error', 'Escolha o momento do dia.');
      return;
    }
    const confirmed = confirm(`Apagar o registro de ${dateInput.value ? toBR(dateInput.value) : ''}?`);
    if (!confirmed) return;
    const payload = { date: toBR(dateInput.value), type: selectedType, action: 'delete' };
    sendRecord(payload, deleteBtn, '🗑', '…', 'Registro apagado da planilha.');
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
